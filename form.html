<form>
<!-- name -->
    <label for="name">Full Name: </label>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
    <br><br>
<!-- Email -->
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>
    <br><br>
<!-- password -->
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter your password" required>
    <br><br>
<!-- number -->
    <label for="number">Number:</label>
    <input type="number" id="number" name="number" placeholder="Enter your number" required>
    <br><br>
<!-- date of birth -->
    <label for="date">Date of birth:</label>
    <input type="date" id="date" name="date" placeholder="Enter your date of birth" required>
    <br><br>
<!-- select gender -->
    <label for="gender">Select your Gender:</label>
    <input type="radio" id="male" name="gender" value="male" required>
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female" required>
    <label for="female">Female</label>
    <br><br>
<!-- select programming language -->
    <label for="language">Select your programming language: /_ \</label required> 
    <br><br>
    <input type="checkbox" id="python" name="language" value="python">
    <label for="python">Python</label>
    <input type="checkbox" id="java" name="language" value="java">
    <label for="java">Java</label>
    <input type="checkbox" id="javascript" name="language" value="javascript">
    <label for="javascript">JavaScript</label>
    <input type="checkbox" id="c++" name="language" value="c++">
    <label for="c++">C++</label>
    <br><br>
<!-- other language -->
    <label for="other">Other language:</label>
    <input type="checkbox" id="other" name="language" value="HTML5">
    <label for="other">HTML5</label>
    <input type="checkbox" id="other" name="language" value="CSS3">
    <label for="other">CSS3</label>
    <input type="checkbox" id="other" name="language" value="PHP">
    <label for="other">PHP</label>
    <br><br>
    <!-- country -->
    <label for="country">Select your country:</label required>
    <select name="country">
        <optgroup label="Asia">
            <option>Bangladesh</option>
            <option>India</option>
            <option>Pakistan</option>
            <option>China</option>
        </optgroup>

        <optgroup label="Europe">
            <option>Germany</option>
            <option>France</option>
            <option>Italy</option>
            <option>Spain</option>
        </optgroup>
    </select>
    <br><br>
    <!-- Textarea -->
    <label for="bio">Your short bio:</label>
    <textarea name="bio" id="bio" cols="30" rows="5" placeholder="Write your short bio here..."></textarea>
    <br><br>
    <!-- profile picture -->
    <label for="picture">Upload your profile picture:</label required>
    <input type="file" id="picture" name="picture">
    <br><br>
    <button type="submit">Register</button>
</form>
<br><br>
</p>
